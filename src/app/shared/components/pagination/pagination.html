<nav aria-label="Paginación" class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-gray-500">
        Mostrando
        <span class="font-semibold text-gray-900">
            {{ startItem() }}
        </span>
        -
        <span class="font-semibold text-gray-900">
            {{ endItem() }}
        </span>
        de
        <span class="font-semibold text-gray-900">
            {{ total() }}
        </span>
        registros
    </p>

    <div class="flex items-center gap-3">
        <button type="button" [disabled]="!canPrevious()" (click)="previous()"
            class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40">
            Anterior
        </button>

        <span class="text-sm text-gray-600">
            Página {{ page() }} de {{ totalPages() }}
        </span>

        <button type="button" [disabled]="!canNext()" (click)="next()"
            class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40">
            Siguiente
        </button>
    </div>
</nav>
