
<div class="min-h-screen bg-slate-50">

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Contenido administrativo -->
    <div class="flex min-w-0 flex-1 flex-col">

      <!-- Header -->
      <header
        class="flex h-16 shrink-0 items-center justify-between
              border-b border-slate-200 bg-white
              pl-16 pr-4 shadow-sm
              md:pl-6 md:pr-6 lg:px-8">

        <!-- Identidad del panel -->
        <div class="min-w-0">
                  <h1 class="hidden text-sm font-semibold text-slate-800 sm:block">
          Panel administrativo
        </h1>

        <p class="hidden text-xs text-slate-500 sm:block">
  Eventos SaaS
</p>
        
        </div>

        <!-- Empresa y usuario -->
        <div class="flex items-center gap-3">

          <!-- Empresa activa -->
          <div
            class="hidden items-center gap-2 rounded-lg
                   border border-slate-200 bg-slate-50
                   px-3 py-2 sm:flex">

            <span class="text-xs text-slate-500">
              Empresa:
            </span>

            <span
              class="max-w-36 truncate text-xs
                     font-semibold text-slate-800">
              {{ companyName() }}
            </span>

          </div>

          <!-- Menú de usuario -->
          <div class="relative group">

            <button
              type="button"
              aria-label="Opciones de usuario"
              class="flex items-center gap-2 rounded-lg
                    border border-slate-200 !bg-white
                    px-2 py-1.5 !text-slate-700
                    shadow-sm hover:!bg-slate-50">

              <span
                class="grid h-9 w-9 place-items-center
                       rounded-full bg-blue-100
                       text-xs font-bold text-blue-700">
                {{ userInitials() }}
              </span>

              <span
                class="hidden max-w-44 truncate
                       text-xs font-medium text-slate-700
                       lg:block">
                {{ userEmail() }}
              </span>

            </button>

            <!-- Desplegable -->
            <div
              class="invisible absolute right-0 z-50 mt-1
                     w-64 rounded-xl border border-slate-200
                     bg-white p-2 opacity-0 shadow-xl
                     transition-all
                     group-hover:visible group-hover:opacity-100
                     group-focus-within:visible
                     group-focus-within:opacity-100">

              <div class="border-b border-slate-100 px-3 py-2">
                <p class="text-xs text-slate-500">
                  Sesión iniciada como
                </p>

                <p class="truncate text-sm font-medium text-slate-800">
                  {{ userEmail() }}
                </p>
              </div>

              <button
                type="button"
                (click)="logout()"
                class="mt-1 w-full rounded-lg px-3 py-2
                       text-left text-sm font-medium
                       text-red-600 hover:bg-red-50">
                Cerrar sesión
              </button>

            </div>

          </div>

        </div>
      </header>

      <!-- Contenido del módulo -->
      <main class="min-w-0 flex-1 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto w-full max-w-screen-2xl">
          <router-outlet></router-outlet>
        </div>
      </main>

    </div>

  </div>

</div>
