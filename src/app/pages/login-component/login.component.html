<main class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-10">
  <div class="w-full max-w-md">
    <div class="mb-6 flex flex-col items-center gap-2">
          <app-brand-logo [size]="44" [showProduct]="true" />
          <p class="text-sm text-slate-500">{{ brand.tagline }}</p>
        </div>

    <section class="card p-8">
      <h1 class="page-title">Iniciar sesión</h1>
      <p class="page-subtitle">Accede al panel de tu empresa de eventos.</p>

      @if (auth.endedReason() === 'expired') {
        <p role="status" class="mt-6 rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
          Tu sesión terminó. Vuelve a iniciar sesión para continuar.
        </p>
      }

      <form class="mt-6 space-y-5" (ngSubmit)="submit()" #loginForm="ngForm">
        <div>
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email" class="form-control" type="email" name="email" [(ngModel)]="email" required autocomplete="username" placeholder="nombre@empresa.com">
        </div>
        <div>
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="form-label mb-0">Contraseña</label>
            <a routerLink="/forgot-password" class="text-sm font-medium">¿Olvidaste tu contraseña?</a>
          </div>
          <input id="password" class="form-control" type="password" name="password" [(ngModel)]="password" required autocomplete="current-password">
        </div>

        @if (error()) {
          <p role="alert" class="alert-error">{{ error() }}</p>
        }

        <button type="submit" class="btn-primary w-full" [disabled]="busy() || loginForm.invalid">
          {{ busy() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        ¿No tienes empresa? <a routerLink="/register" class="font-semibold">Crear cuenta</a>
      </p>
    </section>
  </div>
</main>
