name: E2E Playwright (manual scaffold)
on:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure isolated MySQL and start Flask + Angular
        run: |
          echo 'Not configured: set up dedicated MySQL, run migrations, and start both servers before enabling E2E.'
          exit 1
      - run: npm run e2e
        env:
          E2E_ALLOW_WRITES: 'yes'
